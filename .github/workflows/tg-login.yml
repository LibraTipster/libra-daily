name: Login Telegram (una vez)
on: workflow_dispatch
jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Iniciar sesion y guardar cifrada
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MEMBERS_KEY: ${{ secrets.MEMBERS_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          pip install -q telethon cryptography
          python3 - <<'PY'
          import os, time, json, base64, hashlib, urllib.request
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession
          from telethon.errors import SessionPasswordNeededError
          from cryptography.fernet import Fernet
          H = {'Authorization': 'Bearer ' + os.environ['NOTION_TOKEN'], 'Notion-Version': '2022-06-28', 'Content-Type': 'application/json'}
          def nreq(m, p, b=None):
              r = urllib.request.Request('https://api.notion.com/v1/' + p, json.dumps(b).encode() if b is not None else None, H, method=m)
              return json.load(urllib.request.urlopen(r, timeout=60))
          def getv(pid):
              rt = nreq('GET', 'pages/' + pid)['properties']['Telegram ID']['rich_text']
              return ''.join(t['plain_text'] for t in rt).strip()
          def setv(pid, v):
              parts = [v[i:i+1900] for i in range(0, len(v), 1900)]
              nreq('PATCH', 'pages/' + pid, {'properties': {'Telegram ID': {'rich_text': [{'text': {'content': x}} for x in parts]}}})
          TEL = '417f13b8700e81cdab9ae27826c2030f'
          COD = '417f13b8700e81ddab52c78a6d137806'
          PAS = '417f13b8700e81f7b6b3c46bef495d78'
          SES = '417f13b8700e8178832dc3c4fab53d7d'
          def wait(pid, secs):
              end = time.time() + secs
              while time.time() < end:
                  v = getv(pid)
                  if v:
                      return v
                  time.sleep(6)
              raise SystemExit('Tiempo agotado esperando el dato en Notion')
          phone = getv(TEL)
          if not phone:
              raise SystemExit('Falta el telefono en Notion')
          setv(COD, '')
          c = TelegramClient(StringSession(), int(os.environ['TG_API_ID']), os.environ['TG_API_HASH'])
          c.connect()
          sent = c.send_code_request(phone)
          print('Codigo enviado a tu Telegram. Esperando que lo escribas en Notion...')
          code = wait(COD, 540).replace(' ', '')
          try:
              c.sign_in(phone=phone, code=code, phone_code_hash=sent.phone_code_hash)
          except SessionPasswordNeededError:
              print('Pide contrasena de dos pasos. Esperando en Notion...')
              c.sign_in(password=wait(PAS, 300))
          print('Sesion iniciada:', bool(c.get_me()))
          s = c.session.save()
          key = base64.urlsafe_b64encode(hashlib.pbkdf2_hmac('sha256', os.environ['MEMBERS_KEY'].encode(), b'libra-tg-session', 200000, 32))
          setv(SES, Fernet(key).encrypt(s.encode()).decode())
          for p in (TEL, COD, PAS):
              setv(p, '')
          c.disconnect()
          print('Sesion guardada cifrada. Datos temporales borrados.')
          PY
