name: Prueba desde tu cuenta
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publicar prueba en Prueba Claude
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          MEMBERS_KEY: ${{ secrets.MEMBERS_KEY }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          pip install -q telethon cryptography
          python3 -u - <<'PY'
          import os, json, base64, hashlib, urllib.request
          from telethon.sync import TelegramClient
          from telethon.sessions import StringSession
          from telethon.tl.types import MessageEntityBold, MessageEntityItalic, MessageEntityUnderline, MessageEntityCustomEmoji, PeerChannel
          from cryptography.fernet import Fernet
          H = {'Authorization': 'Bearer ' + os.environ['NOTION_TOKEN'], 'Notion-Version': '2022-06-28'}
          r = urllib.request.Request('https://api.notion.com/v1/pages/418f13b8700e8141a75af7c6c621f9c6', headers=H)
          rt = json.load(urllib.request.urlopen(r, timeout=60))['properties']['Dato real']['rich_text']
          tok = ''.join(t['plain_text'] for t in rt)
          key = base64.urlsafe_b64encode(hashlib.pbkdf2_hmac('sha256', os.environ['MEMBERS_KEY'].encode(), b'libra-tg-session', 200000, 32))
          sess = Fernet(key).decrypt(tok.encode()).decode()
          c = TelegramClient(StringSession(sess), int(os.environ['TG_API_ID']), os.environ['TG_API_HASH'])
          c.connect()
          print('autorizado:', c.is_user_authorized())
          c.get_dialogs()
          ch = c.get_entity(PeerChannel(4487273513))
          def u16(s): return len(s.encode('utf-16-le')) // 2
          parts = [('💙', 'emoji', 5418269241549791048), ('STAKE 1 | RESPONSABILIDAD ', 'bi', 0), ('📊', 'emoji', 5231200819986047254),
                   ('🔞\n\n', 'i', 0), ('👑', 'emoji', 6219549292458150316), (' ', 'i', 0), ('Andreeva vs Muchova', 'iu', 0), ('\n', 'i', 0),
                   ('✅', 'emoji', 5415607860769857239), (' Andreeva gana', 'i', 0)]
          text = ''; ents = []
          for s, k, d in parts:
              o = u16(text); l = u16(s); text += s
              if k == 'emoji':
                  ents.append(MessageEntityCustomEmoji(o, l, d)); ents.append(MessageEntityItalic(o, l))
              else:
                  if 'b' in k: ents.append(MessageEntityBold(o, l))
                  if 'i' in k: ents.append(MessageEntityItalic(o, l))
                  if 'u' in k: ents.append(MessageEntityUnderline(o, l))
          m = c.send_message(ch, text, formatting_entities=ents)
          print('enviado; entidades:', sorted({type(e).__name__ for e in (m.entities or [])}))
          c.disconnect()
          PY
