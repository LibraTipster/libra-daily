name: Diagnostico Notion
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: Que ve la integracion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          H = {'Authorization': 'Bearer ' + os.environ['NOTION_TOKEN'], 'Notion-Version': '2022-06-28', 'Content-Type': 'application/json'}
          r = urllib.request.Request('https://api.notion.com/v1/search', json.dumps({'page_size': 50}).encode(), H, method='POST')
          j = json.load(urllib.request.urlopen(r, timeout=60))
          for x in j['results']:
              t = ''
              if x['object'] == 'database':
                  t = ''.join(a['plain_text'] for a in x['title'])
              else:
                  for p in x.get('properties', {}).values():
                      if p.get('type') == 'title':
                          t = ''.join(a['plain_text'] for a in p['title'])
              print(x['object'], '|', t[:60], '|', x['id'][:8])
          PY
